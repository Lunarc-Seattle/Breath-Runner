<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroCare SimInfra — Trace-Driven Power/Thermal Simulation & Pulmonary Telemetry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F6F5F0;
      color: #111315;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-serif {
      font-family: 'Instrument Serif', Georgia, serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.28s ease-out forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Multi-File Modular React 18 Entry Point -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
