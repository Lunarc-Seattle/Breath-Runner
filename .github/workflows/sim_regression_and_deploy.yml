name: Simulation Regression CI & GitHub Pages Deployment

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  simulation-regression-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository & Trace Assets
        uses: actions/checkout@v4

      - name: Run Python Trace-Driven Power/Thermal Regression Suite
        run: python3 scripts/automation/run_regression.py --verify-reproducibility

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Multi-File Web & Infrastructure Bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
