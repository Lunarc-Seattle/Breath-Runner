# Weekly dependency updates, batched so each ecosystem opens at most one PR a week.
# Major npm upgrades (React 19, TypeScript 7, Tailwind 4, ESLint 10, ...) need code migrations,
# so they are done deliberately on a branch instead of as automatic PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /scripts/assets
    schedule:
      interval: monthly
